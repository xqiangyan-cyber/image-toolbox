<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片小工具箱</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#202638;--muted:#697386;--line:#e5e9f1;--accent:#5b65e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Microsoft Yahei",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px;position:sticky;top:0;z-index:3}
.head{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:21px;font-weight:800}.brand span{color:var(--accent)}.sub{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:28px auto;padding:0 18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab,button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit}
.tab.active,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.layout{display:grid;grid-template-columns: minmax(0,1.6fr) minmax(260px,.8fr);gap:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px #24304a0a}
.canvas-wrap{min-height:390px;background: repeating-conic-gradient(#f1f3f7 0% 25%,#fff 0% 50%) 50%/22px 22px;border:1px dashed #ccd3e0;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
canvas{max-width:100%;max-height:560px;object-fit:contain;display:none;touch-action:none}
.empty{text-align:center;padding:35px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}
.controls{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-weight:650;font-size:14px}.field small{color:var(--muted)}
input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit}
input[type=range]{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}
.note{font-size:12px;color:var(--muted);margin-top:12px}.status{font-size:13px;color:var(--accent);min-height:20px}
.drop{margin-top:12px}.hidden{display:none!important}
footer{max-width:1100px;margin:22px auto 40px;padding:0 18px;color:var(--muted);font-size:12px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.canvas-wrap{min-height:280px}.head{align-items:flex-start;flex-direction:column}header{position:static}}
</style>
</head>
<body>
<header><div class="head"><div><div class="brand">✦ 图片<span>小工具箱</span></div><div class="sub">简单、免费、尽量在本地完成图片处理</div></div><div class="sub">无需注册 · 图片默认不上传服务器</div></div></header>
<main>
<div class="tabs">
<button class="tab active" data-tool="cutout">AI 一键抠图</button>
<button class="tab" data-tool="watermark">添加水印</button>
<button class="tab" data-tool="repair">局部修复</button>
<button class="tab" data-tool="crop">裁剪与缩放</button>
</div>
<div class="layout">
<section class="panel">
<div class="canvas-wrap" id="stage">
<div class="empty" id="empty"><strong>先上传一张图片</strong>支持 JPG、PNG、WebP<br><button class="primary drop" id="choose">选择图片</button></div>
<canvas id="canvas"></canvas>
</div>
<div class="actions"><button id="undo">撤销</button><button id="reset">恢复原图</button><button class="primary" id="download">下载处理后的图片</button></div>
<input id="file" type="file" accept="image/*" hidden>
<div class="note">提示：图片在浏览器中处理。请只处理自己拥有版权或已获授权的图片。</div>
</section>
<aside class="panel">
<div class="controls">
<div class="field"><label>当前功能</label><div id="toolTitle">AI 一键抠图</div></div>
<div id="cutoutControls">
<button class="primary" id="removeBg">开始 AI 抠图</button>
<div class="status" id="cutoutStatus"></div>
<small>首次使用会从网络加载 AI 模型，耗时取决于设备和网络。需要保持页面打开。</small>
</div>
<div id="watermarkControls" class="hidden">
<div class="field"><label>水印文字</label><input id="wmText" type="text" value="我的水印" maxlength="40"></div>
<div class="field"><label>文字颜色</label><input id="wmColor" type="color" value="#ffffff"></div>
<div class="field"><label>字号：<span id="wmSizeVal">36</span> px</label><input id="wmSize" type="range" min="12" max="100" value="36"></div>
<div class="field"><label>透明度：<span id="wmAlphaVal">35</span>%</label><input id="wmAlpha" type="range" min="5" max="100" value="35"></div>
<div class="field"><label>位置</label><select id="wmPosition"><option value="br">右下角</option><option value="center">居中</option><option value="bl">左下角</option><option value="tr">右上角</option><option value="tl">左上角</option></select></div>
<button class="primary" id="applyWm">添加水印</button>
</div>
<div id="repairControls" class="hidden">
<div class="field"><label>修复笔刷大小：<span id="brushVal">24</span> px</label><input id="brush" type="range" min="8" max="90" value="24"></div>
<p class="note">在图片上涂抹要处理的区域，再点“模糊遮盖”。这是基础像素处理，不是生成式无痕修复；复杂背景可能留下痕迹。</p>
<button class="primary" id="blurArea">模糊遮盖涂抹区域</button>
<button id="clearMask">清除涂抹</button>
</div>
<div id="cropControls" class="hidden">
<div class="row"><div class="field"><label>宽度（像素）</label><input id="outW" type="number" min="1" max="10000" placeholder="原图宽度"></div><div class="field"><label>高度（像素）</label><input id="outH" type="number" min="1" max="10000" placeholder="原图高度"></div></div>
<div class="field"><label>缩放比例</label><select id="scale"><option value="1">原尺寸</option><option value=".75">75%</option><option value=".5">50%</option><option value=".25">25%</option></select></div>
<button class="primary" id="resize">应用尺寸</button>
</div>
<div class="status" id="generalStatus"></div>
</div>
</aside>
</div>
</main>
<footer>本工具为免费试用版。AI 抠图依赖第三方开源模型及网络下载；处理速度、浏览器兼容性受设备影响。局部修复仅为基础模糊处理。请勿用于侵犯他人版权、隐私或移除权利标识。</footer>
<script type="module">
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
let original=null, history=[], currentTool='cutout', mask=null, drawing=false, img=null;
function say(t){$('generalStatus').textContent=t}
function save(){if(canvas.width&&canvas.height){history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>8)history.shift()}}
function restoreImage(data){canvas.width=data.width;canvas.height=data.height;ctx.putImageData(data,0,0);canvas.style.display='block';$('empty').classList.add('hidden')}
function loadFile(file){if(!file||!file.type.startsWith('image/'))return;const url=URL.createObjectURL(file);img=new Image();img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.drawImage(img,0,0);original=ctx.getImageData(0,0,canvas.width,canvas.height);history=[];mask=null;canvas.style.display='block';$('empty').classList.add('hidden');$('outW').value=canvas.width;$('outH').value=canvas.height;say('图片已载入：'+canvas.width+' × '+canvas.height);URL.revokeObjectURL(url)};img.src=url}
$('choose').onclick=()=>$('file').click();$('file').onchange=e=>loadFile(e.target.files[0]);
$('stage').addEventListener('dragover',e=>e.preventDefault());$('stage').addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])});
function requireImage(){if(!canvas.width){say('请先上传图片');return false}return true}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));currentTool=b.dataset.tool;[['cutout','cutoutControls'],['watermark','watermarkControls'],['repair','repairControls'],['crop','cropControls']].forEach(([t,id])=>$(id).classList.toggle('hidden',t!==currentTool));$('toolTitle').textContent=b.textContent;say('')});
$('undo').onclick=()=>{if(history.length)ctx.putImageData(history.pop(),0,0);else say('没有可撤销的操作')};
$('reset').onclick=()=>{if(original){history=[];ctx.putImageData(original,0,0);say('已恢复到刚上传的原图')}};
$('download').onclick=()=>{if(!requireImage())return;const a=document.createElement('a');a.download='图片处理结果.png';a.href=canvas.toDataURL('image/png');a.click()};
$('wmSize').oninput=e=>$('wmSizeVal').textContent=e.target.value;$('wmAlpha').oninput=e=>$('wmAlphaVal').textContent=e.target.value;
$('applyWm').onclick=()=>{if(!requireImage())return;save();const text=$('wmText').value;if(!text)return say('请输入水印文字');const size=+$('wmSize').value,pad=size*.6;ctx.save();ctx.font=`${size}px sans-serif`;ctx.fillStyle=$('wmColor').value;ctx.globalAlpha=+$('wmAlpha').value/100;ctx.textBaseline='middle';let x=pad,y=pad;const w=ctx.measureText(text).width,p=$('wmPosition').value;if(p==='br'){x=canvas.width-w-pad;y=canvas.height-pad-size/2}else if(p==='bl'){y=canvas.height-pad-size/2}else if(p==='tr'){x=canvas.width-w-pad}else if(p==='center'){x=(canvas.width-w)/2;y=canvas.height/2}else{x=pad;y=pad+size/2}ctx.fillText(text,x,y);ctx.restore();say('水印已添加')};
$('brush').oninput=e=>$('brushVal').textContent=e.target.value;
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener('pointerdown',e=>{if(currentTool!=='repair'||!requireImage())return;drawing=true;mask=mask||document.createElement('canvas');mask.width=canvas.width;mask.height=canvas.height;const p=point(e);const m=mask.getContext('2d');m.fillStyle='#fff';m.beginPath();m.arc(p.x,p.y,+$('brush').value/2,0,Math.PI*2);m.fill();});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e),m=mask.getContext('2d');m.fillStyle='#fff';m.beginPath();m.arc(p.x,p.y,+$('brush').value/2,0,Math.PI*2);m.fill();});
window.addEventListener('pointerup',()=>drawing=false);
$('clearMask').onclick=()=>{mask=null;say('已清除涂抹区域')};
$('blurArea').onclick=()=>{if(!requireImage()||!mask)return say('请先在图片上涂抹区域');save();const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;tmp.getContext('2d').drawImage(canvas,0,0);const blurred=document.createElement('canvas');blurred.width=canvas.width;blurred.height=canvas.height;const b=blurred.getContext('2d');b.filter='blur(12px)';b.drawImage(tmp,0,0);b.filter='none';const m=mask.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;const src=ctx.getImageData(0,0,canvas.width,canvas.height),bl=b.getImageData(0,0,canvas.width,canvas.height);for(let i=0;i<m.length;i+=4)if(m[i+3]>0){src.data[i]=bl.data[i];src.data[i+1]=bl.data[i+1];src.data[i+2]=bl.data[i+2]}ctx.putImageData(src,0,0);mask=null;say('已完成基础模糊处理')};
$('resize').onclick=()=>{if(!requireImage())return;save();const w=Math.max(1,Math.min(10000,+$('outW').value||canvas.width)),h=Math.max(1,Math.min(10000,+$('outH').value||canvas.height)),s=+$('scale').value;const t=document.createElement('canvas');t.width=Math.round(w*s);t.height=Math.round(h*s);t.getContext('2d').drawImage(canvas,0,0,t.width,t.height);canvas.width=t.width;canvas.height=t.height;ctx.drawImage(t,0,0);say('尺寸已调整为 '+canvas.width+' × '+canvas.height)};
$('removeBg').onclick=async()=>{if(!requireImage())return;const btn=$('removeBg'),status=$('cutoutStatus');btn.disabled=true;status.textContent='正在加载 AI 模型，首次可能需要几分钟…';try{const {removeBackground}=await import('https://esm.sh/@imgly/background-removal@1.5.5');const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const result=await removeBackground(blob,{progress:(key,current,total)=>{if(total)status.textContent=`正在处理：${Math.round(current/total*100)}%`}});const bitmap=await createImageBitmap(result);save();canvas.width=bitmap.width;canvas.height=bitmap.height;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0);status.textContent='抠图完成，可以下载透明 PNG。'}catch(err){console.error(err);status.textContent='抠图失败：请检查网络，使用最新版 Chrome/Edge 后重试。'}finally{btn.disabled=false}};
</script>
</body></html>
